[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
markers = ["integration: testes HTTP de integração"]

[tool.coverage.run]
source = ["app"]
branch = true

[tool.coverage.report]
show_missing = true
skip_covered = false

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
